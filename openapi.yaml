
openapi: 3.0.3

info:
  title: Task Tracker API
  description: REST API for managing projects, users, and tasks.
  version: 1.0.0

servers:
  - url: http://localhost:9000
    description: Local development server

tags:
  - name: Projects
    description: Project management operations
  - name: Users
    description: User management operations
  - name: Tasks
    description: Task management operations

paths:
  /api/projects:
    post:
      tags:
        - Projects
      summary: Create a project
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
      responses:
        '201':
          description: Project created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

    get:
      tags:
        - Projects
      summary: Get all projects
      operationId: getAllProjects
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Projects retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'

  /api/projects/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'

    get:
      tags:
        - Projects
      summary: Get a project by ID
      operationId: getProjectById
      responses:
        '200':
          description: Project found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Projects
      summary: Update a project
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
      responses:
        '200':
          description: Project updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    delete:
      tags:
        - Projects
      summary: Delete a project
      operationId: deleteProject
      responses:
        '204':
          description: Project deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/projects/{id}/tasks:
    get:
      tags:
        - Projects
      summary: Get tasks belonging to a project
      operationId: getTasksByProjectId
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Project tasks retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/users:
    post:
      tags:
        - Users
      summary: Create a user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

    get:
      tags:
        - Users
      summary: Get all users
      operationId: getAllUsers
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'

  /api/users/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'

    get:
      tags:
        - Users
      summary: Get a user by ID
      operationId: getUserById
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Users
      summary: Update a user
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    delete:
      tags:
        - Users
      summary: Delete a user
      operationId: deleteUser
      responses:
        '204':
          description: User deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/tasks:
    post:
      tags:
        - Tasks
      summary: Create a task
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRequest'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Referenced project or assignee not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

    get:
      tags:
        - Tasks
      summary: Get tasks with optional filters
      operationId: getTasks
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: status
          in: query
          required: false
          description: Filter tasks by status
          schema:
            $ref: '#/components/schemas/TaskStatus'
        - name: projectId
          in: query
          required: false
          description: Filter tasks by project ID
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Tasks retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPage'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'

    get:
      tags:
        - Tasks
      summary: Get a task by ID
      operationId: getTaskById
      responses:
        '200':
          description: Task found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Tasks
      summary: Update a task
      operationId: updateTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRequest'
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Tasks
      summary: Delete a task
      operationId: deleteTask
      responses:
        '204':
          description: Task deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Resource ID
      schema:
        type: integer
        format: int64
        minimum: 1

    Page:
      name: page
      in: query
      required: false
      description: Zero-based page number
      schema:
        type: integer
        minimum: 0
        default: 0

    Size:
      name: size
      in: query
      required: false
      description: Number of records per page
      schema:
        type: integer
        minimum: 1
        default: 10

  schemas:
    ProjectRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 150
          minLength: 1
          example: Task Tracker
        description:
          type: string
          maxLength: 1000
          nullable: true
          example: A project for tracking tasks

    ProjectResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
          example: Task Tracker
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    UserRequest:
      type: object
      required:
        - name
        - email
        - role
      properties:
        name:
          type: string
          maxLength: 150
          minLength: 1
          example: Ameet Reddy
        email:
          type: string
          format: email
          maxLength: 254
          example: ameet@example.com
        role:
          type: string
          maxLength: 50
          example: DEVELOPER

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
          example: Ameet Reddy
        email:
          type: string
          format: email
          example: ameet@example.com
        role:
          type: string
          example: DEVELOPER

    TaskRequest:
      type: object
      required:
        - title
        - status
        - projectId
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 1
          example: Implement task creation API
        description:
          type: string
          nullable: true
          example: Add the task creation endpoint
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          allOf:
            - $ref: '#/components/schemas/TaskPriority'
          nullable: true
          description: Defaults to MEDIUM when omitted
        projectId:
          type: integer
          format: int64
          minimum: 1
          example: 1
        assigneeId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          example: 1
        dueDate:
          type: string
          format: date
          nullable: true
          example: '2026-12-31'

    TaskResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        projectId:
          type: integer
          format: int64
        projectName:
          type: string
        assigneeId:
          type: integer
          format: int64
          nullable: true
        assigneeName:
          type: string
          nullable: true
        dueDate:
          type: string
          format: date
          nullable: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    TaskStatus:
      type: string
      enum:
        - TODO
        - IN_PROGRESS
        - DONE
      example: TODO

    TaskPriority:
      type: string
      enum:
        - HIGH
        - MEDIUM
        - LOW
      example: MEDIUM

    ProjectPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProjectResponse'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        size:
          type: integer
        number:
          type: integer
        first:
          type: boolean
        last:
          type: boolean
        numberOfElements:
          type: integer
        empty:
          type: boolean

    UserPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        size:
          type: integer
        number:
          type: integer
        first:
          type: boolean
        last:
          type: boolean
        numberOfElements:
          type: integer
        empty:
          type: boolean

    TaskPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/TaskResponse'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        size:
          type: integer
        number:
          type: integer
        first:
          type: boolean
        last:
          type: boolean
        numberOfElements:
          type: integer
        empty:
          type: boolean

    ApiErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: Request validation failed
        details:
          type: object
          additionalProperties:
            type: string

  responses:
    BadRequest:
      description: Invalid request or validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

    NotFound:
      description: Requested resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

    Conflict:
      description: Resource conflict or business rule violation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
